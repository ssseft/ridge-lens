name: ridge-lens

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ridgelens}
      POSTGRES_USER: ${POSTGRES_USER:-ridgelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RIDGELENS_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ridgelens}
      RIDGELENS_DB_USER: ${POSTGRES_USER:-ridgelens}
      RIDGELENS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bash', '-ec', 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/mountains HTTP/1.0\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:5173/api/mountains").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))']
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  postgis-data:
